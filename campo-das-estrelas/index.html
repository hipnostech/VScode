<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Campo das Estrelas</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{
  --bg:#05070f;
  --ui-bg:rgba(12,16,34,.42);
  --ui-bg-hover:rgba(24,30,58,.62);
  --ui-border:rgba(255,255,255,.16);
  --fg:#eef1ff;
  --dim:rgba(238,241,255,.66);
  --gold:#ffdca3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none}

/* botões de vidro */
.btn{position:fixed;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  background:var(--ui-bg);border:1px solid var(--ui-border);color:var(--fg);cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .5s,background .2s,transform .2s;z-index:20}
.btn:hover{background:var(--ui-bg-hover)}
.btn:active{transform:scale(.94)}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{opacity:0!important;pointer-events:none!important}

#fs{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;opacity:.55}
#fs:hover{opacity:1}
#mute{top:calc(14px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));width:40px;height:40px;opacity:.55}
#mute:hover{opacity:1}
#rot{top:calc(62px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:40px;height:40px;opacity:.55}
#rot:hover{opacity:1}
/* minimapa e mapa grande */
#minimap{position:fixed;inset:auto;left:calc(14px + env(safe-area-inset-left));top:calc(64px + env(safe-area-inset-top));width:124px;height:124px;border-radius:50%;
  z-index:20;cursor:pointer;touch-action:manipulation;border:1px solid var(--ui-border);box-shadow:0 4px 18px rgba(0,0,0,.45);transition:opacity .5s}
@media (max-width:600px),(max-height:500px){#minimap{width:96px;height:96px}}
#bigmap{position:fixed;inset:0;z-index:31;display:grid;place-items:center;background:rgba(3,5,12,.72);transition:opacity .4s;cursor:pointer}
#bigmap canvas{position:static;inset:auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);touch-action:manipulation}
#bigmap .t{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-style:italic;font-size:16px;color:rgba(255,240,220,.75);pointer-events:none}
#mute .off{display:none}
#mute.muted .on{display:none}
#mute.muted .off{display:inline}

/* dica inicial */
#hint{position:fixed;left:16px;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));
  text-align:center;text-wrap:balance;font-size:17px;font-style:italic;letter-spacing:.02em;
  color:var(--dim);text-shadow:0 1px 8px rgba(0,0,0,.8);pointer-events:none;transition:opacity 1.6s;z-index:10;line-height:1.35}

/* joystick (só aparece enquanto o dedo está na tela) */
#joy{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);pointer-events:none;z-index:15;
  opacity:0;transition:opacity .2s}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  background:rgba(255,255,255,.28);box-shadow:0 0 18px rgba(255,255,255,.25)}

/* ocular do telescópio */
#eyepiece{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1.4s ease;
  background:
    radial-gradient(circle closest-side at 50% 50%, transparent 86%, rgba(255,220,160,.10) 88.5%, rgba(0,0,0,.55) 90%, rgba(2,3,8,.96) 97%, #020308 100%);
  background-color:transparent}
#eyepiece.on{opacity:1}
#eyepiece::after{content:"";position:fixed;inset:0;background:#020308;
  -webkit-mask:radial-gradient(circle closest-side at 50% 50%, transparent 99.5%, #000 100%);
          mask:radial-gradient(circle closest-side at 50% 50%, transparent 99.5%, #000 100%)}

#scopeUI{position:fixed;inset:0;pointer-events:none;z-index:12;transition:opacity .8s}
#scopeUI > *{pointer-events:auto}
#close{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right))}
#nav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;align-items:center;gap:14px}
#nav .btn{position:static}
#count{min-width:56px;text-align:center;font-size:18px;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 10px rgba(255,210,140,.5)}
#scopeHint{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);
  width:max-content;max-width:calc(100vw - 120px);text-align:center;font-style:italic;font-size:16px;color:var(--dim);
  pointer-events:none!important;transition:opacity 1.2s}

/* frases que aparecem no céu */
#whisper{position:fixed;left:16px;right:16px;top:calc(16% + env(safe-area-inset-top));text-align:center;
  font-style:italic;font-size:clamp(21px,4.6vw,30px);line-height:1.3;color:#fff5de;text-wrap:balance;
  text-shadow:0 0 14px rgba(0,0,0,.85),0 0 28px rgba(255,210,150,.35);
  opacity:0;transform:translateY(6px);transition:opacity 1.6s ease,transform 1.6s ease;pointer-events:none;z-index:9}
#whisper.quick{transition:opacity .35s ease,transform .35s ease}
#whisper.on{opacity:1;transform:none}

/* botão sentar/levantar */
.pill{position:fixed;height:40px;padding:0 16px;border-radius:20px;background:var(--ui-bg);border:1px solid var(--ui-border);
  color:var(--fg);font:italic 500 17px "Cormorant Garamond",Georgia,serif;letter-spacing:.03em;cursor:pointer;z-index:20;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:.7;transition:opacity .5s,background .2s}
.pill:hover{opacity:1;background:var(--ui-bg-hover)}
#sit{top:calc(14px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right))}

/* abas do telescópio */
#tabs{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:4px;padding:4px;
  border-radius:22px;background:var(--ui-bg);border:1px solid var(--ui-border);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tab{height:32px;padding:0 13px;border-radius:16px;border:0;background:transparent;color:var(--dim);cursor:pointer;white-space:nowrap;
  font:italic 500 16.5px "Cormorant Garamond",Georgia,serif}
.tab.on{background:rgba(255,220,163,.16);color:var(--gold)}
#cosmos{position:fixed;left:16px;right:16px;bottom:calc(30px + env(safe-area-inset-bottom));text-align:center;
  font-style:italic;font-size:clamp(18px,4.2vw,23px);line-height:1.5;color:#f4efff;text-wrap:balance;
  text-shadow:0 0 10px rgba(0,0,0,.95),0 0 24px rgba(130,150,255,.35);pointer-events:none!important}
#cosmos span{display:block;opacity:0;transform:translateY(6px);transition:opacity 1.4s ease,transform 1.4s ease}
#cosmos.on span{opacity:1;transform:none}
#cosmos:not(.on) span{transition-delay:0s!important}

/* pergaminho do poema */
#poem{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;
  background:rgba(3,5,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .6s}
#poemScroll{width:min(580px,100%);max-height:calc(100dvh - 110px);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text;
  padding:44px 40px 36px;border-radius:6px;color:#3b2a1a;
  background:radial-gradient(ellipse at 50% 40%,#f7eed6 0%,#efe2c0 55%,#dcc89a 100%);
  box-shadow:0 0 0 1px rgba(120,80,30,.35),inset 0 0 60px rgba(120,80,30,.28),0 20px 60px rgba(0,0,0,.6);
  font-style:italic;font-size:20px;line-height:1.6}
#poemScroll h1{font-style:normal;font-weight:500;font-size:30px;line-height:1.2;text-align:center;color:#5a1b22;margin-bottom:6px}
#poemScroll .orn{text-align:center;color:#8a6a3a;margin-bottom:26px;letter-spacing:.4em}
#poemScroll p{margin-bottom:1.15em}
#poemScroll p:first-of-type::first-letter{float:left;font-style:normal;font-size:3.1em;line-height:.9;padding:4px 8px 0 0;color:#7a1f2a}
#poemScroll .end{text-align:center;color:#7a1f2a;font-size:22px;margin-top:10px}
#poemClose{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right))}
@media (max-width:520px){ #poemScroll{padding:32px 24px 28px;font-size:18.5px} #poemScroll h1{font-size:26px} }

/* livro Outono */
#book{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;
  background:rgba(10,5,2,.76);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .6s}
#bookWrap{display:flex;flex-direction:column;align-items:center;gap:16px}
#bookSpread{position:relative;display:flex;perspective:2400px;touch-action:pan-y;cursor:pointer;-webkit-user-select:none;user-select:none}
#bookSpread::before{content:'';position:absolute;inset:-11px -13px;border-radius:9px;z-index:-1;
  background:linear-gradient(160deg,#8a3a14,#4e1c08);box-shadow:inset 0 0 0 2px rgba(226,170,90,.5),0 24px 60px rgba(0,0,0,.65)}
.bpage{position:relative;flex:none;width:var(--pw);height:var(--ph);overflow:hidden;padding:var(--pad);color:#3b2414;
  font-size:var(--fs);line-height:1.55;font-style:italic;text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.bpage.left{border-radius:4px 0 0 4px;background:linear-gradient(90deg,#e6d3a8 0%,#f8eed6 9%,#f6ead0 84%,#d6bf8f 100%)}
.bpage.right{border-radius:0 4px 4px 0;background:linear-gradient(90deg,#d6bf8f 0%,#f6ead0 16%,#f8eed6 91%,#e6d3a8 100%)}
#bookSpread.single .bpage.right{border-radius:4px}
.bpage p.drop::first-letter{float:left;font-style:normal;font-size:3.3em;line-height:.85;padding:5px 8px 0 0;color:#9a3a12}
.bpage .num{position:absolute;left:0;right:0;bottom:calc(var(--fs)*1.1);text-align:center;font-size:.75em;font-style:normal;color:#9a7a4a;letter-spacing:.1em}
.bpage.title,.bpage.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bpage.title h1{font-weight:500;font-style:normal;font-size:2.7em;line-height:1.1;color:#8a3210;letter-spacing:.05em}
.bpage.title .orn{color:#b0702a;letter-spacing:.45em;margin:10px 0 14px}
.bpage.title .sub{color:#7a4a22;font-size:.95em}
.bpage .lv{font-style:normal;font-size:1.7em;margin:18px 0}
.bpage.end .fim{color:#8a3210;font-size:1.3em;letter-spacing:.2em}
.bpage.blank{background-color:#7a3a16;background-image:radial-gradient(circle at 30% 30%,rgba(255,200,120,.16) 0 2px,transparent 3px),linear-gradient(90deg,#8a4418,#6a2e10)!important;background-size:26px 26px,auto}
#bTurn{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:3;display:none;pointer-events:none}
#bTurn.r{left:var(--pw);transform-origin:left center}
#bTurn.l{transform-origin:right center}
#bookSpread.single #bTurn.r{left:0}
#bTurn .bpage{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 0 30px rgba(60,30,10,.35)}
#bTurn .bpage:last-child{transform:rotateY(180deg)}
#bookNav{display:flex;align-items:center;gap:18px}
#bookNav .btn{position:static}
#bookNav .btn:disabled{opacity:.3;pointer-events:none}
#bookCount{min-width:64px;text-align:center;font-size:18px;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 10px rgba(255,210,140,.5)}
#bookClose{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right))}

/* desejo */
#wish{position:fixed;inset:0;z-index:31;display:grid;place-items:center;padding:16px;background:rgba(3,5,12,.6);transition:opacity .4s}
#wish .box{width:min(420px,100%);padding:26px 24px 20px;border-radius:8px;color:#3b2a1a;font-style:italic;
  background:radial-gradient(ellipse at 50% 40%,#f7eed6 0%,#efe2c0 60%,#dcc89a 100%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
#wish .t{text-align:center;font-size:22px;color:#7a1f2a;margin-bottom:12px}
#wishText{width:100%;min-height:90px;resize:none;border:0;border-bottom:1px solid rgba(90,50,20,.35);background:transparent;outline:none;
  font:italic 19px "Cormorant Garamond",Georgia,serif;color:#3b2a1a;-webkit-user-select:text;user-select:text;touch-action:auto}
#wish .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
#wish button{height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(90,50,20,.3);background:transparent;color:#5a3a20;font:italic 17px "Cormorant Garamond",Georgia,serif;cursor:pointer}
#wish button.gold{background:#7a1f2a;color:#f7e6c0;border-color:#7a1f2a}

/* foto ampliada */
#lightbox{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  background:rgba(3,5,12,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .45s}
#lightbox img{max-width:min(92vw,1100px);max-height:calc(100dvh - 150px);border-radius:10px;
  box-shadow:0 0 0 1px rgba(255,220,160,.25),0 0 60px rgba(255,210,150,.18);transition:opacity .3s, transform .3s}
#lbClose{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right))}
#lbNav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:14px;align-items:center}
#lbNav .btn{position:static}

/* véu de entrada */
#veil{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;transition:opacity 2.4s ease}
#veil span{font-size:34px;color:var(--gold);animation:pulse 1.6s ease-in-out infinite;text-shadow:0 0 18px rgba(255,210,140,.7)}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:20px;z-index:50;background:var(--bg)}
</style>
</head>
<body>
<div id="veil"><span>✦</span></div>
<div id="err">Não foi possível iniciar o 3D neste navegador.<br>Tente abrir no Chrome ou Safari atualizados.</div>

<button id="fs" class="btn hidden" aria-label="Tela cheia">
  <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<button id="mute" class="btn hidden" aria-label="Ligar ou desligar a música">
  <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<div id="hint" class="hidden"></div>
<div id="whisper"></div>
<button id="sit" class="pill hidden">sentar</button>
<canvas id="minimap" class="hidden" aria-label="Mapa (toque para ampliar)"></canvas>
<div id="bigmap" class="hidden"><canvas></canvas><div class="t">toque em qualquer lugar para fechar o mapa</div></div>
<button id="rot" class="btn hidden" aria-label="Deitar a tela"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="11" rx="2"/><path d="M7 4.5h6.5M11 2.5l2.5 2-2.5 2"/></svg></button>
<div id="joy"><div id="knob"></div></div>

<div id="eyepiece"></div>
<div id="scopeUI" class="hidden">
  <div id="scopeHint">toque na foto para ver maior</div>
  <div id="tabs">
    <button class="tab on" data-t="photos">nossas fotos</button>
    <button class="tab" data-t="galaxy">a galáxia</button>
  </div>
  <div id="cosmos"></div>
  <button id="close" class="btn" aria-label="Sair do telescópio">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="nav" class="navbox">
    <button id="prev" class="btn" aria-label="Estrela anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="count">1 / 5</div>
    <button id="next" class="btn" aria-label="Próxima estrela"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<div id="poem" class="hidden">
  <div id="poemScroll"></div>
  <button id="poemClose" class="btn" aria-label="Fechar poema"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div id="book" class="hidden">
  <div id="bookWrap">
    <div id="bookSpread">
      <div id="bpL" class="bpage left"></div><div id="bpR" class="bpage right"></div>
      <div id="bTurn"><div class="bpage right"></div><div class="bpage left"></div></div>
    </div>
    <div id="bookNav">
      <button id="bookPrev" class="btn" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="bookCount"></div>
      <button id="bookNext" class="btn" aria-label="Próxima página"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <button id="bookClose" class="btn" aria-label="Fechar livro"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div id="wish" class="hidden"><div class="box">
  <div class="t">✦ um desejo para o fogo ✦</div>
  <textarea id="wishText" maxlength="160" placeholder="escreva aqui o seu desejo…"></textarea>
  <div class="row"><button id="wishCancel">agora não</button><button id="wishSend" class="gold">jogar no fogo</button></div>
</div></div>

<div id="lightbox" class="hidden">
  <img id="lbImg" alt="">
  <button id="lbClose" class="btn" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="lbNav">
    <button id="lbPrev" class="btn" aria-label="Foto anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="lbNext" class="btn" aria-label="Próxima foto"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const PHOTOS = ["fotos/foto1.jpg", "fotos/foto2.jpg", "fotos/foto3.jpg", "fotos/foto4.jpg", "fotos/foto5.jpg"];
const MUSIC = ["musica.m4a", "musicas/1-golden-brown.m4a", "musicas/2-i-wanna-be-yours.m4a", "musicas/3-luminary.m4a"];

/* ================================================================== *
 * ✎ TEXTOS — edite à vontade
 * ================================================================== */
const POEM_TITLE = 'Tudo o que o céu me contou';
const POEM = `Deixei a noite acesa neste campo
pra você caminhar devagarinho,
entre margaridas que o vento balança
como quem guarda flores no caminho.

A lua chegou cedo, curiosa,
querendo ver de perto o seu sorriso;
eu disse a ela: "espera, tenha calma,
pra tanta luz, coragem é preciso."

Porque você não chega de uma vez:
você acontece aos poucos, feito aurora,
e mesmo quando o dia já nasceu
eu fico te olhando, sem ir embora.

Escondi seus cachos no desenho da grama,
seus olhos no brilho mais bonito do céu,
sua risada no canto dos grilos
e o seu jeito em tudo o que é meu.

Tem um telescópio esperando por você,
apontado pro canto onde eu guardei
os pedaços mais bonitos da gente,
as horas em que eu mais te amei.

Se um dia alguém te perguntar
por que esse céu brilha tanto assim,
diz que as estrelas só estão tentando
brilhar do jeito que você brilha pra mim.

E se o mundo lá fora fizer barulho,
se o dia pesar mais do que devia,
volta aqui, onde a brisa ainda sopra

almente abri-los. Senti o ar escapar de meus pulmões. Eu definitivamente nunca estive tão viva e tão desperta quanto neste momento, finalmente na presença da rainha, que, com apenas um consentimento dela, seria sua súdita mais fiel e permanente. Meus joelhos se dobram inconscientemente, em saudação, respeito e admiração à mais bela entre as rainhas, que não dominava apenas o seu reino, mas também a mim. Me forço a tentar desviar os olhos dela, mas a tentativa é inútil. Eu já estava completamente hipnotizada a beleza de minha majestade. Ali eu soube que, em uma viajem tão inesperada, mas tão anseiada, eu havia me apaixonado. Em uma noite fria de outono, os tons amarelados e alaranjados da estação passaram a ganhar uma coloração mais azulada e intensa, como a rainha. Teria chegado então o inverno? Mas sinto que nem ao menos o verão acabou totalmente; ainda posso sentir o calor do sol me envolver e as folhas se acumularem ao redor da rainha, as mesmas folhas que antes me contavam sobre ela. Confesso achar que a beleza desse reino se limitava à vastidão encantadora que é o exterior do castelo. Mas aqui, diante da minha rainha, percebo que nada se compara à imensidão da beleza dela. Passo a venerar e idolatrar ela tanto quanto puxo o ar para os meus pulmões. Essa garota, que é a minha rainha, e também o meu mundo inteiro, na eternidade da noite do dia primeiro de outubro.`;

  g.setAttribute('aAlive', alive);

  const m = new THREE.ShaderMaterial({
    side: THREE.DoubleSide,

    vertexShader: GLSL_COMMON + /* glsl */`

      attribute vec2 aOffset; attribute vec4 aParams; attribute float aPart; attribute float aAlive;
      varying vec2 vUv; varying float vPart, vFog, vVar; varying vec3 vW;
      void main(){
        vec2 p=mod(aOffset-uCam.xz+uSize*.5,uSize)-uSize*.5+uCam.xz;
        float dist=length(p-uCam.xz);

        float wave=sin(uTime*1.15+p.x*0.09+p.y*0.07)*0.55+sin(uTime*2.4+p.x*0.31-p.y*0.17)*0.2;

    fragmentShader: /* glsl */`
      uniform sampler2D uTex; uniform vec3 uFog, uLantern; uniform float uFlicker, uDay;
      varying vec2 vUv; varying float vPart, vFog, vVar; varying vec3 vW;
      void main(){

      }`,
  });
  const mesh = new THREE.Mesh(g, m); mesh.frustumCulled = false;

/* colisões: círculos + paredes (segmentos) */
const segColliders = [];
function collide(o, rad) {
  for (const c of colliders) {
    if (!c.r) continue;
    const dx = o.x - c.x, dz = o.z - c.z, d = Math.hypot(dx, dz), min = c.r + rad;
    if (d < min && d > 1e-4) { o.x = c.x + dx / d * min; o.z = c.z + dz / d * min; }
  }
  for (const w of segColliders) {
    const abx = w.bx - w.ax, abz = w.bz - w.az;
    const t = clamp(((o.x - w.ax) * abx + (o.z - w.az) * abz) / (abx * abx + abz * abz), 0, 1);
    const px = w.ax + abx * t, pz = w.az + abz * t, dx = o.x - px, dz = o.z - pz, d = Math.hypot(dx, dz), min = w.r + rad;
    if (d < min && d > 1e-5) { o.x = px + dx / d * min; o.z = pz + dz / d * min; }
  }
}

function updateFX(dt) {
  for (let i = fxList.length - 1; i >= 0; i--) {

    if (k >= 1) { scene.remove(f.sp); f.sp.material.dispose(); fxList.splice(i, 1); continue; }

    f.sp.scale.setScalar(f.size * (1 + f.grow * k)); f.sp.material.opacity = Math.min(1, k / 0.12) * (1 - k);
  }
}

const sfx = (() => {
  let ctx = null, master = null, nb = null, muted = false;
  const ok = () => ctx && ctx.state === 'running';
  const env = (g, t, a, pk, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d); };
  const noise = () => { const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; return s; };
  const filt = (type, f, q = 1) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
  const chain = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
  function chime(notes, vol = 0.16) {
    if (!ok()) return;
    notes.forEach((fr, i) => { const t = ctx.currentTime + i * 0.1, o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = fr; chain(o, g, master); env(g, t, 0.01, vol, 1.4); o.start(t); o.stop(t + 1.5); });
  }
  function whoosh(vol = 0.2, d = 0.5) {
    if (!ok()) return; const t = ctx.currentTime, n = noise(), f = filt('bandpass', 300, 1.2), g = ctx.createGain();
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1200, t + d * 0.6); chain(n, f, g, master); env(g, t, d * 0.4, vol, d); n.start(t); n.stop(t + d + 0.05);
  }
  return {
    init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ctx.destination);
      nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    },
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.55; },
    chime, whoosh,
    meow(p = 1) {
      if (!ok()) return; const t = ctx.currentTime, o = ctx.createOscillator(), f = filt('bandpass', 900 * p, 5), g = ctx.createGain();
      o.type = 'sawtooth'; chain(o, f, g, master);
      o.frequency.setValueAtTime(430 * p, t); o.frequency.linearRampToValueAtTime(740 * p, t + .18); o.frequency.linearRampToValueAtTime(390 * p, t + .55);
      f.frequency.setValueAtTime(900 * p, t); f.frequency.linearRampToValueAtTime(2100 * p, t + .2); f.frequency.linearRampToValueAtTime(700 * p, t + .55);
      env(g, t, .05, .3, .6); o.start(t); o.stop(t + .65);
    },
    purr(d = 2.4) {
      if (!ok()) return; const t = ctx.currentTime, n = noise(), lp = filt('lowpass', 170), am = ctx.createGain(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 24; lg.gain.value = .5; am.gain.value = .5; lfo.connect(lg); lg.connect(am.gain);
      chain(n, lp, am, g, master); env(g, t, .3, 1.1, d); n.start(t); n.stop(t + d + .1); lfo.start(t); lfo.stop(t + d + .1);
    },
    roar() {
      if (!ok()) return; const t = ctx.currentTime, g = ctx.createGain(), lp = filt('lowpass', 500, 2);
      lp.frequency.setValueAtTime(300, t); lp.frequency.linearRampToValueAtTime(1100, t + .4); lp.frequency.linearRampToValueAtTime(250, t + 1.6);
      chain(lp, g, master); env(g, t, .15, .5, 1.7);
      [62, 66, 93].forEach(fr => { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(fr, t); o.frequency.linearRampToValueAtTime(fr * .8, t + 1.6); o.connect(lp); o.start(t); o.stop(t + 1.8); });
      const n = noise(), bp = filt('bandpass', 400, .8); chain(n, bp, lp); n.start(t); n.stop(t + 1.8);
    },
    crackle() {
      if (!ok()) return;
      for (let i = 0; i < 14; i++) { const t = ctx.currentTime + Math.random() * 1.2, n = noise(), f = filt('highpass', 1500), g = ctx.createGain(); chain(n, f, g, master); env(g, t, .003, .25 * Math.random() + .05, .05); n.start(t); n.stop(t + .07); }
    },
    neigh() {
      if (!ok()) return; const t = ctx.currentTime, o = ctx.createOscillator(), f = filt('bandpass', 1400, 3), g = ctx.createGain(), l = ctx.createOscillator(), lg = ctx.createGain();
      o.type = 'sawtooth'; l.frequency.value = 14; lg.gain.value = 60; l.connect(lg); lg.connect(o.frequency);
      o.frequency.setValueAtTime(820, t); o.frequency.linearRampToValueAtTime(980, t + .25); o.frequency.exponentialRampToValueAtTime(420, t + 1.1);
      chain(o, f, g, master); env(g, t, .06, .22, 1.2); o.start(t); o.stop(t + 1.25); l.start(t); l.stop(t + 1.25);
    },
    clop() {
      if (!ok()) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(140, t + .06); chain(o, g, master); env(g, t, .004, .12, .09); o.start(t); o.stop(t + .1);
    },
    hiss() {

      chain(n, f, g, master); env(g, t, .04, .35, .7); n.start(t); n.stop(t + .75);
    },
    creak() {
      if (!ok()) return; const t = ctx.currentTime, o = ctx.createOscillator(), f = filt('bandpass', 650, 4), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(80, t); o.frequency.linearRampToValueAtTime(115, t + .5); o.frequency.linearRampToValueAtTime(70, t + .9);
      chain(o, f, g, master); env(g, t, .1, .08, 1); o.start(t); o.stop(t + 1.05);
    },
  };
})();

/* ------------------------------------------------------------------ *
 * Mapa: minimapa no canto (gira com você) e o mapa grande do reino
 * ------------------------------------------------------------------ */
const MAPR = 255, MAPS = 1024, mapPx = v => (v + MAPR) / (2 * MAPR) * MAPS;

  { i: '🌼', n: 'Campo das Margaridas', ...SPAWN }, { i: '🔭', n: 'Telescópio', ...TELESCOPE, small: true }, { i: '🏰', n: 'Castelo', ...castleToWorld(0, 0) },
  { i: '🦢', n: 'Lago', x: LAKE.x, z: LAKE.z }, { i: '🌾', n: 'Moinho', ...WINDMILL }, { i: '🧝', n: 'Aldeia Élfica', x: VIL.x, z: VIL.z },
  { i: '🧚', n: 'Vila das Fadas', ...FV }, { i: '⚔', n: 'Dungeon das Sombras', x: DGE.x, z: DGE.z }, { i: '🍄', n: 'Condado', ...shW(0, 30) },

{

  const poly = (pts, c) => { g.fillStyle = c; g.beginPath(); pts.forEach((p, i) => g[i ? 'lineTo' : 'moveTo'](...P(p.x, p.z))); g.closePath(); g.fill(); };

  const gr = g.createRadialGradient(MAPS / 2, MAPS / 2, 0, MAPS / 2, MAPS / 2, BOUND * k); gr.addColorStop(0, '#4c6e3a'); gr.addColorStop(0.75, '#3e5c32'); gr.addColorStop(1, '#33492c');

const miniEl = document.getElementById('minimap'), bigEl = document.getElementById('bigmap'), bigCv = bigEl.querySelector('canvas');

let mapT = 0;
function mapPos() { // onde você está no mapa (nos lugares fechados, aponta para a entrada)

}

  g.restore();

function mapIcons() { const l = MAP_PLACES.slice(); if (typeof horse !== 'undefined') l.push({ i: '🐴', n: 'Cavalinho', x: horse.x, z: horse.z, small: true }); return l; }

  const dpr = Math.min(devicePixelRatio || 1, 2), W = miniEl.clientWidth, px = Math.round(W * dpr);
  if (miniEl.width !== px) { miniEl.width = miniEl.height = px; }

/* tela deitada no celular: tela cheia + trava na horizontal (no iPhone, uma dica para girar) */
const rotBtn = document.getElementById('rot');

let landLocked = false;

  e.stopPropagation(); markInteracted();

 * ------------------------------------------------------------------ */

const clock = new THREE.Clock();

  updateTweens(dt);
  if (mode === 'walk') updateWalk(dt);
  else if (mode === 'fly') updateFly(dt);
  else if (mode === 'ride') updateRide(dt);
  else if (camDriver) camDriver(dt);
  else if (scopeCam) camera.position.copy(scopeCam);
  else placeCamera();
  camera.rotation.set(player.pitch, player.yaw, 0);
  uCam.value.copy(camera.position);
  skyGroup.position.copy(camera.position);

  const fl = 0.9 + 0.06 * Math.sin(uTime.value * 11) + 0.05 * Math.sin(uTime.value * 23.7 + 1.3);
  uFlicker.value = fl; lanternLight.intensity = 6 * fl; lanternGlow.material.opacity = 0.75 * fl;
  sparkle.visible = mode === 'walk';

  sparkle.material.rotation = uTime.value * 0.3;
